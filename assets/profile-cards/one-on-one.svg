<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">1:1 沟通助手｜1:1 Manager</title>
  <desc id="desc">帮助管理者组织一对一沟通的 People and Organization Skill</desc>
  <rect x="1" y="1" width="598" height="238" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <g aria-label="标签：skill、lark、HR">
    <rect x="358" y="16" width="58" height="24" rx="12" fill="#DCE8FF" stroke="#2F6BFF" stroke-width="1.2"/>
    <text x="387" y="32" text-anchor="middle" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700">skill</text>
    <rect x="424" y="16" width="70" height="24" rx="12" fill="#D8F3EE" stroke="#14B8A6" stroke-width="1.2"/>
    <text x="459" y="32" text-anchor="middle" fill="#0F766E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700">lark</text>
    <rect x="502" y="16" width="64" height="24" rx="12" fill="#FCE8D5" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="534" y="32" text-anchor="middle" fill="#B45309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700">HR</text>
  </g>
  <text x="34" y="42" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" letter-spacing="1.5">SKILL / PEOPLE &amp; ORG</text>
  <text x="34" y="88" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="32" font-weight="700">1:1 沟通助手</text>
  <text x="34" y="118" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">1:1 Manager</text>
  <text x="34" y="160" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19">帮助管理者更好地组织一对一沟通。</text>
  <text x="34" y="207" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="600">共同上下文 → 一次有效 1:1</text>
  <text x="552" y="207" text-anchor="end" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">OPEN ↗</text>
</svg>
