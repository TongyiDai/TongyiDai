<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-labelledby="title desc">
  <title id="title">蓝色波点｜Blue Dot</title>
  <desc id="desc">将复杂内容转成一图一意的可读视觉 Skill</desc>
  <rect x="1" y="1" width="598" height="188" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <text x="34" y="38" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" letter-spacing="1.5">SKILL / VISUAL</text>
  <text x="34" y="78" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="700">蓝色波点</text>
  <text x="34" y="101" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Blue Dot</text>
  <text x="34" y="132" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">旅行者号回望时，那里只有一颗安静的蓝色波点。</text>
  <text x="34" y="164" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="600">复杂内容 → 一图一意</text>
  <text x="552" y="164" text-anchor="end" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">OPEN ↗</text>
</svg>
