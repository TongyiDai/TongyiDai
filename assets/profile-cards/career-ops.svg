<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">职业操作系统</title>
  <desc id="desc">帮助候选人判断岗位，并准备有证据的表达</desc>
  <rect x="1" y="1" width="598" height="238" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <g aria-label="标签：skill、HR">
    <rect x="430" y="16" width="58" height="24" rx="12" fill="#DCE8FF" stroke="#2F6BFF" stroke-width="1.2"/>
    <text x="459" y="32" text-anchor="middle" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700">skill</text>
    <rect x="496" y="16" width="70" height="24" rx="12" fill="#FCE8D5" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="531" y="32" text-anchor="middle" fill="#B45309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="700">HR</text>
  </g>
  <text x="34" y="42" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" letter-spacing="1.5">SKILL / PEOPLE &amp; ORG</text>
  <text x="34" y="88" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="32" font-weight="700">职业操作系统</text>
  <text x="34" y="118" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Career Ops</text>
  <text x="34" y="160" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19">公司用 AI 筛候选人，它把 AI 交给候选人。</text>
  <text x="34" y="207" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="600">岗位信息 → 求职决策</text>
  <text x="552" y="207" text-anchor="end" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">OPEN ↗</text>
