<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">薪酬结构分析</title>
  <desc id="desc">从脱敏薪酬材料生成可复核的结构分析包</desc>
  <rect x="1" y="1" width="598" height="238" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <g aria-label="标签：Skill、HR、privacy">
    <text x="345" y="27" text-anchor="middle" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">Skill</text>
    <line x1="324" y1="35" x2="366" y2="35" stroke="#2F6BFF" stroke-width="2" stroke-linecap="round"/>
    <text x="426" y="27" text-anchor="middle" fill="#B45309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">HR</text>
    <line x1="413" y1="35" x2="439" y2="35" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <text x="516" y="27" text-anchor="middle" fill="#6D28D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="700" letter-spacing="0.5">privacy</text>
    <line x1="486" y1="35" x2="546" y2="35" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="34" y="42" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" letter-spacing="1.5">SKILL / PEOPLE &amp; ORG</text>
  <text x="34" y="88" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="32" font-weight="700">薪酬结构分析</text>
  <text x="34" y="118" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Compensation Structure Analysis</text>
  <text x="34" y="160" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19">薪酬先看结构，再讨论动作。</text>
  <text x="34" y="207" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="600">脱敏材料 → 人工复核</text>
  <text x="552" y="207" text-anchor="end" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">OPEN ↗</text>
</svg>
