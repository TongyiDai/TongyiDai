<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">薪酬结构分析</title>
  <desc id="desc">从脱敏薪酬材料生成可复核的结构分析包</desc>
  <rect x="1" y="1" width="598" height="238" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <g aria-label="标签：Skill、HR、privacy">
    <rect x="304" y="8" width="82" height="30" rx="4" fill="#FCF6EC" stroke="#CBBDA9" stroke-width="1"/>
    <rect x="304" y="8" width="4" height="30" rx="2" fill="#2F6BFF"/>
    <text x="317" y="28" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.4">Skill</text>
    <rect x="394" y="8" width="64" height="30" rx="4" fill="#FCF6EC" stroke="#CBBDA9" stroke-width="1"/>
    <rect x="394" y="8" width="4" height="30" rx="2" fill="#F59E0B"/>
    <text x="407" y="28" fill="#B45309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.4">HR</text>
    <rect x="466" y="8" width="100" height="30" rx="4" fill="#FCF6EC" stroke="#CBBDA9" stroke-width="1"/>
    <rect x="466" y="8" width="4" height="30" rx="2" fill="#8B5CF6"/>
    <text x="479" y="28" fill="#6D28D9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.4">privacy</text>
  </g>
  <text x="34" y="42" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" letter-spacing="1.5">SKILL / PEOPLE &amp; ORG</text>
  <text x="34" y="88" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="32" font-weight="700">薪酬结构分析</text>
  <text x="34" y="118" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Compensation Structure Analysis</text>
