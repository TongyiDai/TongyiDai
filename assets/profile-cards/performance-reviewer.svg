<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">绩效环评人推荐</title>
  <desc id="desc">从授权工作证据推荐 360 环评人</desc>
  <rect x="1" y="1" width="598" height="238" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <g aria-label="标签：Skill、Lark、HR">
    <rect x="308" y="10" width="82" height="28" rx="10" fill="none" stroke="#2F6BFF" stroke-width="1.4"/>
    <text x="349" y="24" dominant-baseline="middle" text-anchor="middle" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700">Skill</text>
    <rect x="398" y="10" width="82" height="28" rx="10" fill="none" stroke="#2F6BFF" stroke-width="1.4"/>
    <text x="439" y="24" dominant-baseline="middle" text-anchor="middle" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700">Lark</text>
    <rect x="488" y="10" width="64" height="28" rx="10" fill="none" stroke="#2F6BFF" stroke-width="1.4"/>
    <text x="520" y="24" dominant-baseline="middle" text-anchor="middle" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="700">HR</text>
  </g>
  <text x="34" y="42" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" letter-spacing="1.5">SKILL / PEOPLE &amp; ORG</text>
  <text x="34" y="88" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="32" font-weight="700">绩效环评人推荐</text>
  <text x="34" y="118" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Performance Reviewer Recommendation</text>
  <text x="34" y="160" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19">你的环评人，它来帮你推荐。</text>
  <text x="34" y="207" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="600">授权证据 → 360 评审人</text>
