<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
  <title id="title">情绪潮汐｜Emotion Tide</title>
  <desc id="desc">把本人飞书消息整理成可校准的私密情绪回顾</desc>
  <rect x="1" y="1" width="598" height="238" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <g aria-label="标签：Skill、Lark">
    <rect x="394" y="8" width="82" height="30" rx="4" fill="#FCF6EC" stroke="#CBBDA9" stroke-width="1"/>
    <rect x="394" y="8" width="4" height="30" rx="2" fill="#2F6BFF"/>
    <text x="407" y="28" fill="#1D4ED8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.4">Skill</text>
    <rect x="484" y="8" width="82" height="30" rx="4" fill="#FCF6EC" stroke="#CBBDA9" stroke-width="1"/>
    <rect x="484" y="8" width="4" height="30" rx="2" fill="#14B8A6"/>
    <text x="497" y="28" fill="#0F766E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="700" letter-spacing="0.4">Lark</text>
  </g>
  <text x="34" y="42" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" letter-spacing="1.5">SKILL / PRIVATE WELLBEING</text>
  <text x="34" y="88" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="32" font-weight="700">情绪潮汐</text>
  <text x="34" y="118" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Emotion Tide</text>
  <text x="34" y="160" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="19">把一天的文字，收成一份私人回顾。</text>
  <text x="34" y="207" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="16" font-weight="600">文本线索 → 用户校准</text>
  <text x="552" y="207" text-anchor="end" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">OPEN ↗</text>
</svg>
