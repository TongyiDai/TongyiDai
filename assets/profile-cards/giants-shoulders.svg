<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-labelledby="title desc">
  <title id="title">巨人之肩</title>
  <desc id="desc">开工前扫描先例，给出清晰裁决</desc>
  <rect x="1" y="1" width="598" height="188" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <text x="34" y="38" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" letter-spacing="1.5">SKILL / PRIOR ART</text>
  <text x="34" y="78" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="700">巨人之肩</text>
  <text x="34" y="101" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Giants' Shoulders</text>
  <text x="34" y="132" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="15">如果说我看得更远，那是因为我站在巨人的肩膀上。</text>
  <text x="34" y="164" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="600">先例扫描 → 一条裁决</text>
  <text x="552" y="164" text-anchor="end" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">OPEN ↗</text>
</svg>
