  <text x="34" y="164" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="13" font-weight="600">材料 → 有判断力的中文</text>
  <text x="552" y="164" text-anchor="end" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12">OPEN ↗</text>
