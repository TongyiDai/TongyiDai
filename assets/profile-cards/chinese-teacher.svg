<svg xmlns="http://www.w3.org/2000/svg" width="600" height="190" viewBox="0 0 600 190" role="img" aria-labelledby="title desc">
  <title id="title">中文老师</title>
  <desc id="desc">让中文工作文档有判断力、有人味、能推动决策</desc>
  <rect x="1" y="1" width="598" height="188" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <rect x="1" y="1" width="10" height="188" rx="5" fill="#2F6BFF"/>
  <text x="34" y="38" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" letter-spacing="1.5">SKILL / WRITING</text>
  <text x="34" y="78" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="26" font-weight="700">中文老师</text>
  <text x="34" y="101" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">Chinese Teacher</text>
