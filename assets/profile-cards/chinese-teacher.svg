<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-labelledby="title desc">
  <title id="title">中文老师</title>
  <desc id="desc">让中文工作文档有判断力、有人味、能推动决策</desc>
  <rect x="1" y="1" width="598" height="218" rx="18" fill="#F6EBD8" stroke="#0B0A09" stroke-width="2"/>
  <text x="34" y="42" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" letter-spacing="1.5">SKILL / WRITING</text>
  <text x="34" y="86" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="30" font-weight="700">中文老师</text>
  <text x="34" y="112" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">Chinese Teacher</text>
  <text x="34" y="151" fill="#0B0A09" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="17">全世界都该学中国话，AI 也不例外。</text>
  <text x="34" y="190" fill="#2F6BFF" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="14" font-weight="600">材料 → 有判断力的中文</text>
  <text x="552" y="190" text-anchor="end" fill="#5B5A57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13">OPEN ↗</text>
</svg>
